---
# ==========================================================
# 1. DAILY DATA INGESTION JOB (Runs at 02:00 AM Daily)
# ==========================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-ingestion-cronjob
  namespace: boutique
spec:
  schedule: "0 2 * * *"
  jobTemplate:
    spec:
      template:
        spec:
          # Thêm token để kéo Image từ GHCR
          imagePullSecrets:
            - name: ghcr-secret
          containers:
          - name: data-ingestion
            image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:9fa4750f99e8a6c8cdbf8d9108e13bc0fe8c85cf
            imagePullPolicy: Always
            command: ["python", "data_ingestion.py"]
            envFrom:
              - configMapRef:
                  name: ai-scaler-config
            volumeMounts:
            - name: shared-mlflow-storage
              mountPath: /mlflow/artifacts
          restartPolicy: OnFailure
          volumes:
          - name: shared-mlflow-storage
            persistentVolumeClaim:
              claimName: mlflow-storage-pvc
---
# ==========================================================
# 2. WEEKLY MODEL RETRAINING JOB (Runs at 02:00 AM every Monday)
# ==========================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-retrain-cronjob
  namespace: boutique
spec:
  schedule: "0 2 * * 1"
  jobTemplate:
    spec:
      template:
        spec:
          # Thêm token để kéo Image từ GHCR
          imagePullSecrets:
            - name: ghcr-secret
          containers:
          - name: model-retrain
            image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:9fa4750f99e8a6c8cdbf8d9108e13bc0fe8c85cf
            imagePullPolicy: Always
            command: ["python", "model_retrain.py"]
            envFrom:
              - configMapRef:
                  name: ai-scaler-config
            volumeMounts:
            - name: shared-mlflow-storage
              mountPath: /mlflow/artifacts
          restartPolicy: OnFailure
          volumes:
          - name: shared-mlflow-storage
            persistentVolumeClaim:
              claimName: mlflow-storage-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
      - name: ai-server
        image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:9fa4750f99e8a6c8cdbf8d9108e13bc0fe8c85cf
        imagePullPolicy: Always
        command: ["uvicorn", "ai_server:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        envFrom:
          - configMapRef:
              name: ai-scaler-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-server-service
  namespace: boutique
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http-api
  selector:
    app: ai-server
