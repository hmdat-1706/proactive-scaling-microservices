apiVersion: batch/v1
kind: CronJob
metadata:
  name: ai-trainer-cronjob
  namespace: boutique
spec:
  schedule: "0 1 * * 1"   # Chạy 1h sáng Thứ 2
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: ai-trainer
            image: hmdat1706/ai-prophet:550dc96dd0ba870aff11f71ff2ced5ed852320e2
            imagePullPolicy: Always
            command: ["python", "ai_trainer.py"]
            envFrom:
              - configMapRef:
                  name: ai-scaler-config
            # Dùng chung ổ cứng PVC với MLflow
            volumeMounts:
            - name: shared-mlflow-storage
              mountPath: /mlflow/artifacts
          restartPolicy: OnFailure
          volumes:
          - name: shared-mlflow-storage
            persistentVolumeClaim:
              claimName: mlflow-storage-pvc
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      containers:
      - name: ai-server
        image: hmdat1706/ai-prophet:550dc96dd0ba870aff11f71ff2ced5ed852320e2
        imagePullPolicy: Always
        command: ["uvicorn", "ai_server:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
        envFrom:
          - configMapRef:
              name: ai-scaler-config
---
apiVersion: v1
kind: Service
metadata:
  name: ai-server-service
  namespace: boutique
spec:
  ports:
  - port: 8000
    targetPort: 8000
    name: http-api
  selector:
    app: ai-server
