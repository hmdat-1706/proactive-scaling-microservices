apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base
  # Preview Service cho Blue/Green frontend
  - frontend-preview-svc.yaml

# Patch chuyển Deployment/frontend → Rollout/frontend với Blue/Green strategy
patches:
  - target:
      kind: Deployment
      name: frontend
    path: frontend-rollout-patch.yaml

images:
  - name: us-central1-docker.pkg.dev/google-samples/microservices-demo/frontend
    newTag: v0.10.6
