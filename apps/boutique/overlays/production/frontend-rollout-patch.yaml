- op: replace
  path: /apiVersion
  value: argoproj.io/v1alpha1
- op: replace
  path: /kind
  value: Rollout
- op: add
  path: /spec/strategy
  value:
    blueGreen:
      # activeService: Service receiving 100% real traffic (Blue)
      activeService: frontend
      # previewService: Service pointing to Green pods, used only for internal testing
      previewService: frontend-preview
      # autoPromotionEnabled: false -> requires manual promotion, no automatic traffic switching
      autoPromotionEnabled: false
      # After promotion, wait 30s before scaling down Blue pods
      scaleDownDelaySeconds: 30
