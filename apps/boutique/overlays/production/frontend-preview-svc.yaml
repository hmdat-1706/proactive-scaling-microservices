apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  namespace: boutique
  labels:
    app: frontend
spec:
  type: ClusterIP
  # Argo Rollouts updates this selector to point to the correct Green pods during a new deploy
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
