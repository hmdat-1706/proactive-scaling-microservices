apiVersion: v1
kind: Service
metadata:
  name: frontend-preview
  namespace: boutique
  labels:
    app: frontend
spec:
  type: ClusterIP
  # Argo Rollouts điều chỉnh selector này để trỏ vào đúng Green pods khi có deploy mới
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
