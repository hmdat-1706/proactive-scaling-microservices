---
# 1. DAILY DATA INGESTION JOB (Runs at 02:00 AM Daily)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-ingestion-cronjob
  namespace: boutique
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      template:
        spec:
          # Thêm token để kéo Image từ GHCR
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: data-ingestion
              image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:d3e5dddc58c8f9d1cecb2a05c03e4f1346928db0
              imagePullPolicy: Always
              command: ["python", "data_ingestion.py"]
              envFrom:
                - configMapRef:
                    name: ai-scaler-config
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              volumeMounts:
                - name: shared-mlflow-storage
                  mountPath: /mlflow/artifacts
          restartPolicy: OnFailure
          volumes:
            - name: shared-mlflow-storage
              persistentVolumeClaim:
                claimName: mlflow-storage-pvc
---
# 2. WEEKLY MODEL RETRAINING JOB (Runs at 02:00 AM every Monday)
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-retrain-cronjob
  namespace: boutique
spec:
  schedule: "0 2 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          # Thêm token để kéo Image từ GHCR
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: model-retrain
              image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:d3e5dddc58c8f9d1cecb2a05c03e4f1346928db0
              imagePullPolicy: Always
              command: ["python", "model_retrain.py"]
              envFrom:
                - configMapRef:
                    name: ai-scaler-config
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: shared-mlflow-storage
                  mountPath: /mlflow/artifacts
          restartPolicy: OnFailure
          volumes:
            - name: shared-mlflow-storage
              persistentVolumeClaim:
                claimName: mlflow-storage-pvc
---
# 3. AI SERVER
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-server
  namespace: boutique
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-server
  template:
    metadata:
      labels:
        app: ai-server
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: ai-server
          image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:d3e5dddc58c8f9d1cecb2a05c03e4f1346928db0
          imagePullPolicy: Always
          command: ["uvicorn", "ai_server:app", "--host", "0.0.0.0", "--port", "8000"]
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: ai-scaler-config
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            tcpSocket:
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-server-service
  namespace: boutique
spec:
  ports:
    - port: 8000
      targetPort: 8000
      name: http-api
  selector:
    app: ai-server
