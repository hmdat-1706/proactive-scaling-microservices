---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: model-retrain-cronjob
  namespace: boutique
spec:
  schedule: "0 2 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        spec:
          imagePullSecrets:
            - name: ghcr-secret
          containers:
            - name: model-retrain
              image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:latest
              imagePullPolicy: Always
              command: ["python", "model_retrain.py"]
              envFrom:
                - configMapRef:
                    name: ai-scaler-config
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  cpu: "1"
                  memory: 1Gi
              volumeMounts:
                - name: shared-mlflow-storage
                  mountPath: /mlflow/artifacts
          restartPolicy: OnFailure
          volumes:
            - name: shared-mlflow-storage
              persistentVolumeClaim:
                claimName: mlflow-storage-pvc
