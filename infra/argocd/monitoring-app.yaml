apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: 'https://prometheus-community.github.io/helm-charts'
      chart: kube-prometheus-stack
      # Upgraded to 75.12.0 (Q1 2025) — additionalPrometheusRulesMap and alertmanager.config schema stable.
      # CRDs handled by ArgoCD ServerSideApply=true.
      targetRevision: 75.12.0
      helm:
        valueFiles:
          - $values/infra/monitoring/values.yaml
    - repoURL: 'https://github.com/hmdat-1706/proactive-scaling-microservices.git'
      targetRevision: main
      ref: values

  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
