---
# ── Step 1: Install base packages on all nodes ──────────────────────────────
- name: Step 1 - Install Base Packages
  hosts: all
  become: yes
  tasks:
    - name: Install curl
      apt:
        name: curl
        update_cache: yes
        state: present

# ── Step 2: Provision K3s Control Plane ─────────────────────────────────────
- name: Step 2 - Provision Master Node
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Install K3s control plane
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Wait for K3s node token to be created
      wait_for:
        path: /var/lib/rancher/k3s/server/node-token
        timeout: 60

    - name: Read K3s node token
      command: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw
      changed_when: false

    - name: Store token and master IP for worker join
      add_host:
        name: K3S_INFO
        token: "{{ k3s_token_raw.stdout }}"
        master_ip: "{{ ansible_host }}"

    - name: Install kubeseal CLI
      shell: |
        curl -sL https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.26.2/kubeseal-0.26.2-linux-amd64.tar.gz \
          | tar -xz kubeseal
        install -m 755 kubeseal /usr/local/bin/kubeseal
      args:
        creates: /usr/local/bin/kubeseal

# ── Step 3: Join Worker Node to Cluster ─────────────────────────────────────
- name: Step 3 - Provision Worker Node & Join Cluster
  hosts: worker
  become: yes
  tasks:
    - name: Download K3s install script
      get_url:
        url: https://get.k3s.io
        dest: /tmp/install-k3s.sh
        mode: "0755"

    - name: Install K3s agent and join master
      command: /tmp/install-k3s.sh
      environment:
        K3S_URL: "https://{{ hostvars['K3S_INFO']['master_ip'] }}:6443"
        K3S_TOKEN: "{{ hostvars['K3S_INFO']['token'] }}"
      args:
        creates: /etc/rancher/k3s/k3s-agent.env

# ── Step 4: Bootstrap Core Infrastructure ───────────────────────────────────
- name: Step 4 - Bootstrap Infrastructure (KEDA & ArgoCD)
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Install KEDA
      command: >
        k3s kubectl apply --server-side
        -f https://github.com/kedacore/keda/releases/download/v2.13.1/keda-2.13.1.yaml

    - name: Create ArgoCD namespace (idempotent)
      command: k3s kubectl create namespace argocd
      register: argocd_ns
      failed_when: argocd_ns.rc != 0 and "already exists" not in argocd_ns.stderr
      changed_when: argocd_ns.rc == 0

    - name: Install ArgoCD
      # Server-side apply bypasses the 256KB annotation limit on large CRDs
      command: >
        k3s kubectl apply --server-side --force-conflicts
        -n argocd
        -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

    - name: Configure ArgoCD to run in insecure mode (disable TLS redirect)
      command: >
        k3s kubectl patch configmap argocd-cmd-params-cm
        -n argocd
        -p '{"data": {"server.insecure": "true"}}'

    - name: Restart ArgoCD server to apply config
      command: k3s kubectl rollout restart deployment argocd-server -n argocd

    - name: Copy ArgoCD App-of-Apps manifest to master
      copy:
        src: ../argocd/argocd-app.yaml
        dest: /tmp/argocd-app.yaml

    - name: Apply ArgoCD App-of-Apps (GitOps bootstrap)
      command: k3s kubectl apply -f /tmp/argocd-app.yaml

# ── Step 5: Seal Secrets & Configure Credentials ────────────────────────────
- name: Step 5 - Post-Provisioning (Seal Secrets & Set Credentials)
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars_prompt:
    - name: ghcr_token
      prompt: "GitHub PAT Token for GHCR"
      private: yes
    - name: grafana_password
      prompt: "Grafana Admin Password"
      private: yes
    - name: argocd_password
      prompt: "ArgoCD Admin Password"
      private: yes
  tasks:
    - name: Install apache2-utils (required for htpasswd)
      apt:
        name: apache2-utils
        state: present

    - name: Wait for ArgoCD server to become ready
      command: >
        k3s kubectl wait --for=condition=available
        deployment/argocd-server -n argocd --timeout=180s
      changed_when: false

    - name: Wait for Sealed Secrets deployment to be created by ArgoCD
      # Bitnami Helm chart creates a deployment named 'sealed-secrets' (not
      # 'sealed-secrets-controller') in kube-system — poll until it appears.
      shell: |
        for i in $(seq 1 36); do
          if k3s kubectl get deployment sealed-secrets -n kube-system > /dev/null 2>&1; then
            echo "Deployment found."
            exit 0
          fi
          echo "[${i}/36] sealed-secrets not found yet, retrying in 10s..."
          sleep 10
        done
        echo "Timeout: sealed-secrets deployment not created after 6 minutes."
        exit 1
      changed_when: false

    - name: Wait for Sealed Secrets controller to be ready
      command: >
        k3s kubectl wait --for=condition=available
        deployment/sealed-secrets -n kube-system --timeout=300s
      changed_when: false

    - name: Ensure target namespaces exist
      command: k3s kubectl create namespace {{ item }}
      loop:
        - boutique
        - monitoring
      register: ns_result
      failed_when: ns_result.rc != 0 and "already exists" not in ns_result.stderr
      changed_when: ns_result.rc == 0

    - name: Fetch Sealed Secrets public certificate
      # --controller-name must match the Helm release name ('sealed-secrets')
      command: >
        kubeseal --fetch-cert
        --controller-namespace kube-system
        --controller-name sealed-secrets
      register: sealed_cert
      changed_when: false

    - name: Write public certificate to temp file
      copy:
        content: "{{ sealed_cert.stdout }}"
        dest: /tmp/pub-cert.pem

    - name: Generate and encrypt GHCR Docker registry secret
      shell: |
        k3s kubectl create secret docker-registry ghcr-secret \
          --namespace boutique \
          --docker-server=ghcr.io \
          --docker-username=hmdat-1706 \
          --docker-password="{{ ghcr_token }}" \
          --dry-run=client -o yaml | \
        kubeseal --format=yaml --cert=/tmp/pub-cert.pem > /tmp/ghcr-sealed.yaml
      no_log: true

    - name: Generate and encrypt Grafana admin credentials secret
      shell: |
        k3s kubectl create secret generic grafana-admin-credentials \
          --namespace monitoring \
          --from-literal=admin-user="admin" \
          --from-literal=admin-password="{{ grafana_password }}" \
          --dry-run=client -o yaml | \
        kubeseal --format=yaml --cert=/tmp/pub-cert.pem > /tmp/grafana-sealed.yaml
      no_log: true

    - name: Apply sealed secrets to cluster
      command: k3s kubectl apply -f {{ item }}
      loop:
        - /tmp/ghcr-sealed.yaml
        - /tmp/grafana-sealed.yaml

    - name: Generate bcrypt hash and set ArgoCD admin password
      shell: |
        HASH=$(htpasswd -nbBC 10 "" "{{ argocd_password }}" | tr -d ':\n' | sed 's/\$2y/\$2a/')
        MTIME=$(date +%FT%T%Z)
        k3s kubectl -n argocd patch secret argocd-secret \
          -p "{\"stringData\": {\"admin.password\": \"${HASH}\", \"admin.passwordMtime\": \"${MTIME}\"}}"
      no_log: true

    - name: Restart ArgoCD server to apply new password
      command: k3s kubectl -n argocd rollout restart deployment argocd-server

    - name: Fetch encrypted GHCR secret to local repo
      fetch:
        src: /tmp/ghcr-sealed.yaml
        dest: ~/proactive-scaling-microservices/apps/prophet/ghcr_sealed.yaml
        flat: yes

    - name: Fetch encrypted Grafana secret to local repo
      fetch:
        src: /tmp/grafana-sealed.yaml
        dest: ~/proactive-scaling-microservices/infra/monitoring/grafana-sealed.yaml
        flat: yes
