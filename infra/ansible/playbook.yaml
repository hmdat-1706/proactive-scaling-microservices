---
# ── Step 1 & 2: Provision K3s Master ────────────────────────────────────────
- name: Step 1 & 2 - Provision Master Node
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Install base packages and kubeseal CLI
      shell: |
        apt-get update && apt-get install -y curl apache2-utils
        curl -sL https://github.com/bitnami-labs/sealed-secrets/releases/download/v0.26.2/kubeseal-0.26.2-linux-amd64.tar.gz | tar -xz kubeseal
        install -m 755 kubeseal /usr/local/bin/kubeseal
      args:
        creates: /usr/local/bin/kubeseal

    - name: Install K3s control plane
      shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /etc/rancher/k3s/k3s.yaml

    - name: Wait for K3s token and store for worker
      shell: |
        while [ ! -f /var/lib/rancher/k3s/server/node-token ]; do sleep 2; done
        cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw
      changed_when: false

    - name: Store K3s info
      add_host:
        name: K3S_INFO
        token: "{{ k3s_token_raw.stdout }}"
        master_ip: "{{ ansible_host }}"

# ── Step 3: Join Worker Node ────────────────────────────────────────────────
- name: Step 3 - Provision Worker Node & Join Cluster
  hosts: worker
  become: yes
  tasks:
    - name: Install K3s agent and join cluster
      shell: |
        apt-get update && apt-get install -y curl
        curl -sfL https://get.k3s.io | sh -
      environment:
        K3S_URL: "https://{{ hostvars['K3S_INFO']['master_ip'] }}:6443"
        K3S_TOKEN: "{{ hostvars['K3S_INFO']['token'] }}"
      args:
        creates: /etc/rancher/k3s/k3s-agent.env

# ── Step 4: Bootstrap Core Infrastructure ───────────────────────────────────
- name: Step 4 - Bootstrap Infrastructure (KEDA & ArgoCD)
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  tasks:
    - name: Install KEDA and ArgoCD
      shell: |
        k3s kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v2.13.1/keda-2.13.1.yaml
        k3s kubectl create namespace argocd --dry-run=client -o yaml | k3s kubectl apply -f -
        k3s kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
        k3s kubectl patch configmap argocd-cmd-params-cm -n argocd -p '{"data": {"server.insecure": "true"}}'
        k3s kubectl rollout restart deployment argocd-server -n argocd

    - name: Copy and apply ArgoCD App-of-Apps manifest
      copy:
        src: ../argocd/argocd-app.yaml
        dest: /tmp/argocd-app.yaml
        
    - name: Apply App-of-Apps
      command: k3s kubectl apply -f /tmp/argocd-app.yaml

# ── Step 5: Seal Secrets & Configure Credentials ────────────────────────────
- name: Step 5 - Post-Provisioning (Seal Secrets & Set Credentials)
  hosts: master
  become: yes
  environment:
    KUBECONFIG: /etc/rancher/k3s/k3s.yaml
  vars_prompt:
    - name: ghcr_token
      prompt: "GitHub PAT Token for GHCR"
      private: yes
    - name: grafana_password
      prompt: "Grafana Admin Password"
      private: yes
    - name: argocd_password
      prompt: "ArgoCD Admin Password"
      private: yes
  tasks:
    - name: Wait for ArgoCD and Sealed Secrets to be ready
      shell: |
        # Wait for the rollout restart of ArgoCD Server from Step 4
        k3s kubectl rollout status deployment/argocd-server -n argocd --timeout=300s
        
        # Wait for Sealed Secrets to be synced by ArgoCD
        for i in $(seq 1 36); do
          if k3s kubectl get deployment sealed-secrets -n kube-system > /dev/null 2>&1; then break; fi
          sleep 10
        done
        k3s kubectl wait --for=condition=available deployment/sealed-secrets -n kube-system --timeout=300s
      changed_when: false

    - name: Generate, encrypt and apply application secrets
      shell: |
        k3s kubectl create namespace boutique --dry-run=client -o yaml | k3s kubectl apply -f -
        k3s kubectl create namespace monitoring --dry-run=client -o yaml | k3s kubectl apply -f -
        
        kubeseal --fetch-cert --controller-namespace kube-system --controller-name sealed-secrets > /tmp/pub-cert.pem
        
        k3s kubectl create secret docker-registry ghcr-secret --namespace boutique --docker-server=ghcr.io --docker-username=hmdat-1706 --docker-password="{{ ghcr_token }}" --dry-run=client -o yaml | kubeseal --format=yaml --cert=/tmp/pub-cert.pem > /tmp/ghcr-sealed.yaml
        k3s kubectl create secret generic grafana-admin-credentials --namespace monitoring --from-literal=admin-user="admin" --from-literal=admin-password="{{ grafana_password }}" --dry-run=client -o yaml | kubeseal --format=yaml --cert=/tmp/pub-cert.pem > /tmp/grafana-sealed.yaml
        k3s kubectl apply -f /tmp/ghcr-sealed.yaml -f /tmp/grafana-sealed.yaml
      no_log: true

    - name: Set ArgoCD admin password
      shell: |
        HASH=$(htpasswd -nbBC 10 "" "{{ argocd_password }}" | tr -d ':\n' | sed 's/\$2y/\$2a/')
        MTIME=$(date +%FT%T%Z)
        k3s kubectl -n argocd patch secret argocd-secret -p "{\"stringData\": {\"admin.password\": \"${HASH}\", \"admin.passwordMtime\": \"${MTIME}\"}}"
        k3s kubectl -n argocd rollout restart deployment argocd-server
      no_log: true

    - name: Fetch encrypted secrets to local Git repo
      fetch:
        src: "{{ item.src }}"
        dest: "{{ item.dest }}"
        flat: yes
      loop:
        - { src: "/tmp/ghcr-sealed.yaml", dest: "~/proactive-scaling-microservices/apps/prophet/ghcr_sealed.yaml" }
        - { src: "/tmp/grafana-sealed.yaml", dest: "~/proactive-scaling-microservices/infra/monitoring/grafana-sealed.yaml" }
