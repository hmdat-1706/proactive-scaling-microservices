---
- name: Install required packages
  apt:
    name:
      - curl
      - wget
      - git
      - apt-transport-https
    update_cache: yes
    state: present

- name: Disable swap
  shell: swapoff -a
  changed_when: false

- name: Disable swap permanently in fstab
  replace:
    path: /etc/fstab
    regexp: '^([^#].*\s+swap\s+.*)$'
    replace: '# \1'
