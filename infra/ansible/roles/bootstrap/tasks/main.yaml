---
- name: Install KEDA
  command: k3s kubectl apply --server-side -f https://github.com/kedacore/keda/releases/download/v{{ keda_version }}/keda-{{ keda_version }}.yaml

- name: Create ArgoCD Namespace
  shell: k3s kubectl create namespace argocd --dry-run=client -o yaml | k3s kubectl apply -f -

- name: Install ArgoCD
  command: k3s kubectl apply --server-side --force-conflicts -n argocd -f https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml

- name: Configure ArgoCD to run in insecure mode
  shell: |
    k3s kubectl patch configmap argocd-cmd-params-cm -n argocd -p '{"data": {"server.insecure": "true"}}'

- name: Restart ArgoCD Server
  command: k3s kubectl rollout restart deployment argocd-server -n argocd

- name: Wait for ArgoCD Server to be ready before bootstrapping
  shell: |
    count=0
    while ! k3s kubectl get deployment argocd-server -n argocd > /dev/null 2>&1; do
      if [ $count -ge 30 ]; then
        echo "Timeout waiting for argocd-server deployment to be created!"
        exit 1
      fi
      sleep 10
      count=$((count+1))
    done
    echo "Deployment found! Waiting for it to become available..."
    k3s kubectl wait --for=condition=available deployment/argocd-server -n argocd --timeout=300s

- name: Copy ArgoCD App-of-Apps manifest to Master
  copy:
    src: "{{ argocd_app_manifest }}"
    dest: /tmp/argocd-app.yaml

- name: Apply ArgoCD App-of-Apps (Bootstrap)
  command: k3s kubectl apply -f /tmp/argocd-app.yaml
