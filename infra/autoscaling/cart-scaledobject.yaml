apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: cart-scale
  namespace: boutique
spec:
  scaleTargetRef:
    name: cartservice
  pollingInterval: 30
  cooldownPeriod: 60
  minReplicaCount: 1
  maxReplicaCount: 4
  advanced:
    scalingModifiers: {}
    scaleDown:
      stabilizationWindowSeconds: 180
  triggers:
    - type: metrics-api
      metadata:
        url: "http://ai-server-service.boutique.svc.cluster.local:8000/api/forecast"
        valueLocation: "predicted_rps"
        targetValue: "70"
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
