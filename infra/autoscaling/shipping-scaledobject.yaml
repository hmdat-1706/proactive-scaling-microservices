apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: shipping-scale
  namespace: boutique
spec:
  scaleTargetRef:
    name: shippingservice
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 3
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
