apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: checkout-scale
  namespace: boutique
spec:
  scaleTargetRef:
    name: checkoutservice
  cooldownPeriod: 180
  minReplicaCount: 1
  maxReplicaCount: 5
  triggers:
    - type: cpu
      metricType: Utilization
      metadata:
        value: "80"
