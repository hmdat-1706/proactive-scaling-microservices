name: CI for AI Prophet Scaler (DevSecOps)

on:
  push:
    paths:
      - 'apps/ai-scaler/**'
      - '!apps/ai-scaler/ai-config.yaml' 
    branches:
      - main

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-scaler
          load: true 
          tags: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-scaler
          push: true
          tags: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Manifest Tag
        run: |
          sed -i "s|image: .*ai-prophet:.*|image: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:${{ github.sha }}|g" apps/ai-scaler/ai-scaler-architecture.yaml
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/ai-scaler/ai-scaler-architecture.yaml
          
          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): update image tag to ${{ github.sha }} [skip ci]"
            git push
          else
            echo "Changes not found."
            exit 1 
          fi
