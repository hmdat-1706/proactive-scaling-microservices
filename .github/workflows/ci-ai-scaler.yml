name: CI for AI Prophet Scaler (DevSecOps)

on:
  push:
    paths:
      - 'apps/ai-scaler/**'
      - '!apps/ai-scaler/ai-scaler-architecture.yaml' 
    branches:
      - main

jobs:
  build-test-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image (Local for testing)
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-scaler
          load: true 
          tags: hmdat1706/ai-prophet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'hmdat1706/ai-prophet:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image to Registry
        uses: docker/build-push-action@v5
        with:
          context: ./apps/ai-scaler
          push: true
          tags: hmdat1706/ai-prophet:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Manifest Tag (GitOps)
        run: |
          # Dùng sed tinh tế, bắt chính xác dòng chứa image và thay mã SHA mới
          sed -i "s|image: hmdat1706/ai-prophet:.*|image: hmdat1706/ai-prophet:${{ github.sha }}|g" apps/ai-scaler/ai-scaler-architecture.yaml
          
          # Cấu hình danh tính cho Bot
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apps/ai-scaler/ai-scaler-architecture.yaml
          
          # Thêm [skip ci] để chắc chắn không kích hoạt action khác
          git commit -m "chore(gitops): update ai-prophet image tag to ${{ github.sha }} [skip ci]"
          
          git push
