name: CI for Prophet Scaler

on:
  # Pull Request: chỉ chạy lint và check, KHÔNG build image
  pull_request:
    branches:
      - main
      - dev
    paths:
      - 'apps/prophet/**'
      - '!apps/prophet/manifests/**'   # Không trigger khi CI bot commit vào overlays

  # Push lên dev, main: build image với tag tương ứng
  # Cũng trigger khi có tag release vX.Y.Z
  push:
    branches:
      - dev
      - main
    tags:
      - 'v*.*.*'
    paths:
      - 'apps/prophet/**'
      - '!apps/prophet/manifests/**'   # Không trigger khi CI bot commit vào overlays

jobs:
  # Job 1: Lint + Check (chạy trên cả PR và push)
  lint-and-check:
    name: Lint & Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Lint Python (Flake8)
        run: |
          pip install flake8
          flake8 apps/prophet/ --count --select=E9,F63,F7,F82 --show-source --statistics

  # Job 2: Build, Scan & Push (chỉ chạy khi push, KHÔNG chạy trên PR)
  build-and-push:
    name: Build, Scan & Push Image
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: lint-and-check
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Determine image tag
        id: tag
        run: |
          # Lấy toàn bộ mã hash của commit (Full SHA)
          SHA=$(echo "${{ github.sha }}")

          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            # Nếu push lên release tag v1.0.0, dùng luôn tag đó
            echo "IMAGE_TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref_name }}" == "dev" ]]; then
            # Nhánh dev -> dev-<sha>
            echo "IMAGE_TAG=dev-${SHA}" >> $GITHUB_OUTPUT
          else
            # Nhánh main -> main-<sha>
            echo "IMAGE_TAG=main-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./apps/prophet
          push: true
          tags: ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:${{ steps.tag.outputs.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:${{ steps.tag.outputs.IMAGE_TAG }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Setup Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update Manifest Tag with Kustomize
        if: github.ref_name == 'dev' || github.ref_name == 'main' || startsWith(github.ref, 'refs/tags/')
        run: |
          if [[ "${{ github.ref_name }}" == "dev" ]]; then
            TARGET_DIR="apps/prophet/manifests/overlays/dev"
          else
            TARGET_DIR="apps/prophet/manifests/overlays/production"
          fi

          cd $TARGET_DIR
          kustomize edit set image ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet=ghcr.io/hmdat-1706/proactive-scaling-microservices/ai-prophet:${{ steps.tag.outputs.IMAGE_TAG }}
          cd -

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add $TARGET_DIR/kustomization.yaml

          if ! git diff --cached --quiet; then
            git commit -m "chore(gitops): update image tag to ${{ steps.tag.outputs.IMAGE_TAG }} [skip ci]"
            git push
          else
            echo "No manifest changes detected."
          fi
